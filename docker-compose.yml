# Container logs capped globally — VPS disks stay slim without daemon changes.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: minecraft-paper-server
    ports:
      - "25565:25565"
      - "25575:25575" # RCON — used by dashboard for operator chat + spectator setup
    environment:
      TYPE: "PAPER"
      VERSION: "1.20.4"
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      ALLOW_FLIGHT: "TRUE"
      MEMORY: "2G"
      VIEW_DISTANCE: "6" # bot-only world; 10 was burning CPU for no one
      SPAWN_PROTECTION: "0"
      SEED: "${MC_SEED:-}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-changeme}"
      RCON_PORT: "25575"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M # live RSS ran ~90% of the old 2500M cap; +570M GC headroom
    volumes:
      - ./minecraft-server:/data
    networks:
      - minecraft-network
    restart: unless-stopped
    logging: *default-logging

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-embeddings
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text}"
    # Auto-serve and self-provision model on first boot
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        PID=$$!
        echo "Waiting for Ollama daemon to initialize..."
        until ollama list > /dev/null 2>&1; do
          sleep 1
        done
        echo "Self-provisioning embedding model: $${OLLAMA_MODEL:-nomic-embed-text}..."
        ollama pull $${OLLAMA_MODEL:-nomic-embed-text}
        echo "Self-provisioning chat fallback: qwen2.5:3b-instruct..."
        ollama pull qwen2.5:3b-instruct
        echo "All Ollama models ready!"
        wait $$PID
    healthcheck:
      test: [ "CMD-SHELL", "ollama list | grep -q $${OLLAMA_MODEL:-nomic-embed-text} || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          # Raised 1.0/1536M -> 1.5/3072M: hosts qwen2.5:3b chat fallback
          # alongside nomic embeddings (~2.4GB combined peak).
          cpus: '1.5'
          memory: 3072M
    networks:
      - minecraft-network
    restart: unless-stopped
    logging: *default-logging

  memory-service:
    build:
      context: .
      dockerfile: memory-service/Dockerfile
    container_name: memory-service
    ports:
      - "3002:3002"
    environment:
      MEMORY_PORT: 3002
      BROKER_URL: "http://brain-broker:3001"
      # Heap below container cap: vector-index snapshots spike RAM transiently.
      NODE_OPTIONS: "--max-old-space-size=192"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      MISTRAL_MODEL: "${MISTRAL_MODEL:-mistral-small-latest}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-ollama}"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text}"
    volumes:
      # Full store mount so civilization ledger.json + vector snapshots persist
      - ./memory-service/store:/app/memory-service/store
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - minecraft-network
    restart: unless-stopped
    logging: *default-logging

  brain-broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    container_name: brain-broker
    ports:
      - "3001:3001"
    environment:
      BROKER_PORT: 3001
      MEMORY_SERVICE_URL: "http://memory-service:3002"
      # Heap must be explicitly capped below the container limit or the
      # kernel OOM-kills this process before V8 garbage collection triggers.
      NODE_OPTIONS: "--max-old-space-size=192"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.1-8b-instant}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY}"
      CEREBRAS_MODEL: "${CEREBRAS_MODEL:-llama3.1-8b}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}"
      AGNES_API_KEY: "${AGNES_API_KEY}"
      AGNES_MODEL: "${AGNES_MODEL:-deepseek-v3}"
      LLM7_API_KEY: "${LLM7_API_KEY:-unused}"
      LLM7_MODEL: "${LLM7_MODEL:-default}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY:-}"
      SILICONFLOW_MODEL: "${SILICONFLOW_MODEL:-Qwen/Qwen3-8B-Instruct}"
      ZHIPU_API_KEY: "${ZHIPU_API_KEY:-}"
      ZHIPU_MODEL: "${ZHIPU_MODEL:-glm-4-flash}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      MISTRAL_MODEL: "${MISTRAL_MODEL:-mistral-small-latest}"
      FREELLMAPI_KEY: "${FREELLMAPI_KEY:-}"
      FREELLMAPI_BASE_URL: "${FREELLMAPI_BASE_URL:-http://freellmapi:3001/v1}"
      FREELLMAPI_MODEL: "${FREELLMAPI_MODEL:-auto}"
      OLLAMA_LOCAL_HOST: "http://ollama:11434"
      OLLAMA_LOCAL_MODEL: "${OLLAMA_LOCAL_MODEL:-qwen2.5:3b-instruct}"
      GITHUB_MODELS_TOKEN: "${GITHUB_MODELS_TOKEN:-}"
      GITHUB_MODEL: "${GITHUB_MODEL:-openai/gpt-4o-mini}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_MODEL: "${CLOUDFLARE_MODEL:-@cf/meta/llama-3.1-8b-instruct-fp8-fast}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HUGGINGFACE_MODEL: "${HUGGINGFACE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}"
      COHERE_API_KEY: "${COHERE_API_KEY:-}"
      COHERE_MODEL: "${COHERE_MODEL:-command-a-02-2025}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      QWEN_MODEL: "${QWEN_MODEL:-qwen-flash}"
      LITEROUTER_API_KEY: "${LITEROUTER_API_KEY:-}"
      LITEROUTER_MODEL: "${LITEROUTER_MODEL:-deepseek/deepseek-v3:free}"
      TOKENREPLY_API_KEY: "${TOKENREPLY_API_KEY:-}"
      TOKENREPLY_MODEL: "${TOKENREPLY_MODEL:-qwen/qwen-2.5-72b-instruct}"
      POLLINATIONS_MODEL: "${POLLINATIONS_MODEL:-openai}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-300}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-ollama}"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text}"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      memory-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - minecraft-network
    restart: unless-stopped
    logging: *default-logging

