services:
  minecraft-server:
    image: itzg/minecraft-server:latest
    container_name: minecraft-paper-server
    ports:
      - "25565:25565"
      - "25575:25575"   # RCON — used by dashboard for operator chat + spectator setup
    environment:
      TYPE: "PAPER"
      VERSION: "1.20.4"
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
      SPAWN_PROTECTION: "0"
      SEED: "${MC_SEED:-}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-changeme}"
      RCON_PORT: "25575"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2500M
    volumes:
      - ./minecraft-server:/data
    networks:
      - minecraft-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-embeddings
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text}"
    # Auto-serve and self-provision model on first boot
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        PID=$$!
        echo "Waiting for Ollama daemon to initialize..."
        until ollama list > /dev/null 2>&1; do
          sleep 1
        done
        echo "Self-provisioning embedding model: $${OLLAMA_MODEL:-nomic-embed-text}..."
        ollama pull $${OLLAMA_MODEL:-nomic-embed-text}
        echo "Embedding model ready!"
        wait $$PID
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q $${OLLAMA_MODEL:-nomic-embed-text} || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    networks:
      - minecraft-network
    restart: unless-stopped

  memory-service:
    build:
      context: .
      dockerfile: memory-service/Dockerfile
    container_name: memory-service
    ports:
      - "3002:3002"
    environment:
      MEMORY_PORT: 3002
      BROKER_URL: "http://brain-broker:3001"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-ollama}"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text}"
    volumes:
      - ./memory-service/store/agents:/app/memory-service/store/agents
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - minecraft-network
    restart: unless-stopped

  brain-broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    container_name: brain-broker
    ports:
      - "3001:3001"
    environment:
      BROKER_PORT: 3001
      MEMORY_SERVICE_URL: "http://memory-service:3002"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-300}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-ollama}"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-nomic-embed-text}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      memory-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - minecraft-network
    restart: unless-stopped

  agent-alpha:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: agent-alpha
    expose:
      - "3010"   # /status endpoint for dashboard
      - "3020"   # Native 3D POV stream
    environment:
      MC_HOST: "minecraft-server"
      MC_PORT: 25565
      MC_USERNAME: "Agent_Alpha"
      MC_VERSION: "1.20.4"
      COMMAND_PREFIX: "!"
      PERSONALITY_SEED: "${PERSONALITY_SEED_ALPHA:-random}"
      CONFIDENCE_THRESHOLD: "0.6"
      BROKER_URL: "http://brain-broker:3001"
      MEMORY_SERVICE_URL: "http://memory-service:3002"
      STATUS_PORT: "3010"
      VIEWER_PORT: "3020"
    depends_on:
      minecraft-server:
        condition: service_started
      brain-broker:
        condition: service_healthy
      memory-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 384M
    networks:
      - minecraft-network
    restart: unless-stopped

  agent-beta:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: agent-beta
    expose:
      - "3011"   # /status endpoint for dashboard
      - "3021"   # Native 3D POV stream
    environment:
      MC_HOST: "minecraft-server"
      MC_PORT: 25565
      MC_USERNAME: "Agent_Beta"
      MC_VERSION: "1.20.4"
      COMMAND_PREFIX: "!"
      PERSONALITY_SEED: "${PERSONALITY_SEED_BETA:-random}"
      CONFIDENCE_THRESHOLD: "0.6"
      BROKER_URL: "http://brain-broker:3001"
      MEMORY_SERVICE_URL: "http://memory-service:3002"
      STATUS_PORT: "3011"
      VIEWER_PORT: "3021"
    depends_on:
      minecraft-server:
        condition: service_started
      brain-broker:
        condition: service_healthy
      memory-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 384M
    networks:
      - minecraft-network
    restart: unless-stopped

  agent-gamma:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: agent-gamma
    expose:
      - "3012"   # /status endpoint for dashboard
      - "3022"   # Native 3D POV stream
    environment:
      MC_HOST: "minecraft-server"
      MC_PORT: 25565
      MC_USERNAME: "Agent_Gamma"
      MC_VERSION: "1.20.4"
      COMMAND_PREFIX: "!"
      PERSONALITY_SEED: "${PERSONALITY_SEED_GAMMA:-random}"
      CONFIDENCE_THRESHOLD: "0.6"
      BROKER_URL: "http://brain-broker:3001"
      MEMORY_SERVICE_URL: "http://memory-service:3002"
      STATUS_PORT: "3012"
      VIEWER_PORT: "3022"
    depends_on:
      minecraft-server:
        condition: service_started
      brain-broker:
        condition: service_healthy
      memory-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 384M
    networks:
      - minecraft-network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: civilization-dashboard
    ports:
      - "3003:3003"   # Main dashboard UI
    environment:
      DASHBOARD_PORT: 3003
      VIEWER_PORT: 3004
      BROKER_URL: "http://brain-broker:3001"
      MEMORY_SERVICE_URL: "http://memory-service:3002"
      AGENT_ALPHA_STATUS_URL: "http://agent-alpha:3010"
      AGENT_BETA_STATUS_URL: "http://agent-beta:3011"
      MC_HOST: "minecraft-server"
      MC_PORT: 25565
      MC_VERSION: "1.20.4"
      SPECTATOR_USERNAME: "SpectatorBot"
      RCON_HOST: "minecraft-server"
      RCON_PORT: 25575
      RCON_PASSWORD: "${RCON_PASSWORD:-changeme}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      brain-broker:
        condition: service_healthy
      memory-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M   # Larger cap — mineflayer spectator bot + prismarine-viewer live here
    networks:
      - minecraft-network
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  minecraft-network:
    driver: bridge

