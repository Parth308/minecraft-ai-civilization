<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Civilization — Control Tower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Main navigation">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true">⛏</div>
        <div>
          <div class="logo-text">Control Tower</div>
          <span class="logo-sub">AI Civilization Ops</span>
        </div>
      </div>

      <button class="nav-item" data-page="overview" aria-current="page">
        <span class="nav-icon" aria-hidden="true">◉</span><span class="nav-label">Overview</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="world">
        <span class="nav-icon" aria-hidden="true">🌍</span><span class="nav-label">3D World View</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="agents">
        <span class="nav-icon" aria-hidden="true">☰</span><span class="nav-label">Agents</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="decisions">
        <span class="nav-icon" aria-hidden="true">⑂</span><span class="nav-label">Decisions</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="chronicle">
        <span class="nav-icon" aria-hidden="true">📜</span><span class="nav-label">Chronicle</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="costs">
        <span class="nav-icon" aria-hidden="true">$</span><span class="nav-label">Costs &amp; Limits</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>

      <div class="nav-divider"></div>
      <div class="nav-section-label">Intel</div>

      <button class="nav-item" data-page="skills">
        <span class="nav-icon" aria-hidden="true">📊</span><span class="nav-label">Skills &amp; XP</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="memory">
        <span class="nav-icon" aria-hidden="true">🧠</span><span class="nav-label">Memory</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="crafting">
        <span class="nav-icon" aria-hidden="true">⚒️</span><span class="nav-label">Crafting</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="exploration">
        <span class="nav-icon" aria-hidden="true">🗺️</span><span class="nav-label">Exploration</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="discoveries">
        <span class="nav-icon" aria-hidden="true">⛏️</span><span class="nav-label">Discoveries</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>

      <div class="nav-divider"></div>
      <div class="nav-section-label">Social</div>

      <button class="nav-item" data-page="trades">
        <span class="nav-icon" aria-hidden="true">🔄</span><span class="nav-label">Trades</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="debts">
        <span class="nav-icon" aria-hidden="true">📋</span><span class="nav-label">Debts &amp; IOUs</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="social">
        <span class="nav-icon" aria-hidden="true">👥</span><span class="nav-label">Relationships</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>

      <div class="nav-divider"></div>
      <div class="nav-section-label">System</div>

      <button class="nav-item" data-page="taxes">
        <span class="nav-icon" aria-hidden="true">💰</span><span class="nav-label">Taxes</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="investigations">
        <span class="nav-icon" aria-hidden="true">🔍</span><span class="nav-label">Investigations</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>
      <button class="nav-item" data-page="stats">
        <span class="nav-icon" aria-hidden="true">📈</span><span class="nav-label">Stats History</span>
        <span class="nav-dot" aria-hidden="true"></span>
      </button>

      <div class="sidebar-footer">
        <div class="svc-row"><span>Spectator</span><span class="status-pill" id="svc-spectator" title="Spectator 3D Stream"></span></div>
        <div class="svc-row"><span>Broker</span><span class="status-pill" id="svc-broker" title="Broker status"></span></div>
        <div class="svc-row"><span>Memory</span><span class="status-pill" id="svc-memory" title="Memory service status"></span></div>
        <div class="svc-row"><span>WS</span><span class="status-pill err" id="svc-ws" title="Dashboard connection"></span></div>
      </div>
    </nav>

    <main class="main" id="page-root" aria-live="polite"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
